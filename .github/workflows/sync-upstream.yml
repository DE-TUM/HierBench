name: Sync Fork

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add pykeen https://github.com/pykeen/pykeen.git

      - name: Fetch upstream
        run: git fetch pykeen master

      - name: Merge upstream into main
        run: git merge pykeen/master --no-edit

      - name: Push to main
        run: git push origin main
